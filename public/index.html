<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>CineVault</title>
</head>

<body>

    <main>

        <!-- Ricerca e filtri -->
        <section id="movie-search">

            <div id="search-bar">

                <button type="button" id="collection-button">
                    La mia collezione
                </button>

                <input
                    type="text"
                    id="search-input"
                    placeholder="Cerca un film..."
                    autocomplete="off"
                >

                <button type="button" id="search-button">
                    Cerca
                </button>

                <button
                    type="button"
                    id="filter-toggle"
                    aria-label="Apri filtri"
                    aria-expanded="false"
                >
                    ⋮
                </button>

                <!-- Pannello filtri -->
                <div id="movie-filters">

                    <div class="filter-group">
                        <label for="filter-year">Anno</label>
                        <input
                            type="number"
                            id="filter-year"
                            placeholder="Es. 2024"
                            min="1900"
                            max="2100"
                        >
                    </div>

                    <div class="filter-group">
                        <label for="filter-rating">Rating minimo</label>
                        <input
                            type="number"
                            id="filter-rating"
                            placeholder="Es. 7.0"
                            min="0"
                            max="10"
                            step="0.1"
                        >
                    </div>

                    <button type="button" id="filter-button">
                        Applica filtri
                    </button>

                </div>

            </div>

            <!-- Risultati suggeriti della ricerca -->
            <div id="search-results"></div>

        </section>


        <!-- Lista dei film -->
        <section id="movies-section">

            <h2>Film popolari</h2>

            <div id="movies-container"></div>

            <div id="pagination"></div>

        </section>


        <!-- Collezione personale -->
        <section id="collection-section">

            <button
                type="button"
                id="back-to-movies-from-collection"
            >
                ← Torna ai film
            </button>

            <h2>La mia collezione</h2>

            <div id="collection-container"></div>

        </section>


        <!-- Dettaglio del film -->
        <section id="movie-detail"></section>

    </main>


    <script type="module" src="main.js"></script>

</body>
</html>
